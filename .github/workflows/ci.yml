name: CI

on:
  # Once, on the pull request. A merge into main isn't checked again: main requires this check and an up-to-date
  # branch, so a merge lands exactly what its pull request tested.
  pull_request:
  # The Version workflow starts it on the commit it bumps, which GitHub holds as a pull_request run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # astro sync (the content collections' types), then tsc.
      - run: bun run types:check
      - run: bun run build
