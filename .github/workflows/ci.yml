name: CI

on:
  # On develop only: every push to it, and every pull request into it (Dependabot's). A develop → main pull request
  # is checked by develop's run on the same commit, and main isn't checked again after the merge: main requires
  # this check on an up-to-date branch, so what's merged is exactly what passed here.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # By hand, on any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # astro sync (the content collections' types), then tsc.
      - run: bun run types:check
      - run: bun run build
