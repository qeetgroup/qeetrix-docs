name: Release

# Deploys ui.qeet.in on merge to main, then tags the commit — the same shape as
# qeetrix-ui's and qeetrix-icons' release, with a Vercel production deploy where
# they publish to npm. The tag is created *after* a successful deploy, so every
# `v*` tag is a version that is really live.
#
# The flow end to end:
#
#   1. Raise the version in package.json on develop, then open the PR into main
#      (develop → main); its Release gate fails until it's raised. The version
#      you are about to ship is in the PR diff.
#   2. Merge to main. This workflow builds the commit (Verify passed on the pull
#      request, and the build ran locally before the push), deploys it to
#      Vercel production, pushes the matching `vX.Y.Z` tag and opens a GitHub
#      Release.
#   3. Bad release? Run `rollback.yml` with an earlier tag — it redeploys
#      exactly the commit that tag names.
#
# Why deploy-then-tag rather than tag-then-deploy: GitHub raises no workflow
# events for anything done with the default GITHUB_TOKEN, so a tag pushed by
# this workflow could never trigger a separate `on: push: tags` deploy — it
# would silently never run. Deploying this exact commit and tagging it after a
# successful deploy gives the same guarantee, the tag names what went live,
# without that trap. A failed deploy leaves no tag behind.
#
# Re-running is safe: if package.json's version is already tagged, it is
# already live and everything below is skipped.
#
# ── Required configuration ────────────────────────────────────────────────
# Settings → Secrets and variables → Actions
#
#   Secret    VERCEL_TOKEN       Vercel → Account Settings → Tokens, scoped to
#                                the Qeet Group team
#   Variable  VERCEL_ORG_ID      from `vercel link` (.vercel/project.json)
#   Variable  VERCEL_PROJECT_ID  same file
#
# Without them the workflow still checks the version, then reports that deploying
# is not configured and creates no tag. The CLI builds here and uploads the
# finished output, so the deployment is pinned to this commit rather than to
# whatever sits at the head of a branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    # Production ships only from main — a manual run on another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ui.qeet.in
    permissions:
      contents: write # push the version tag after a successful deploy
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so tags are visible

      - id: version
        name: is there anything to release?
        run: |
          set -uo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged, so it is already live — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.release == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # the Vercel CLI's runtime

      - if: steps.version.outputs.release == 'true'
        run: bun install --frozen-lockfile

      # Verify passed on the develop → main pull request, so it doesn't run again here. The site is built in
      # `vercel build` below
      # (vercel.json: `bun run build`).

      # Secrets are unavailable in a step-level `if`, so reduce the decision to
      # a boolean output. Evaluates to "true"/"false" and never prints the token.
      - id: creds
        if: steps.version.outputs.release == 'true'
        name: is deploying configured?
        run: |
          echo "ready=${{ secrets.VERCEL_TOKEN != '' && vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ready == 'true'
        name: install the Vercel CLI
        run: npm install --global vercel@latest

      - if: steps.creds.outputs.ready == 'true'
        name: pull the production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - if: steps.creds.outputs.ready == 'true'
        name: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - id: deploy
        if: steps.creds.outputs.ready == 'true'
        name: deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Tag AFTER a successful deploy, so every tag is a version that is live.
      - if: steps.deploy.outcome == 'success'
        name: tag the release and open a GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --repo "${{ github.repository }}"

      - if: steps.deploy.outcome == 'success'
        name: summarise
        run: |
          {
            echo "## Released ${{ steps.version.outputs.tag }}"
            echo
            echo "Live at https://ui.qeet.in (deployment: ${{ steps.deploy.outputs.url }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - if: steps.version.outputs.release == 'false'
        name: report that the version is unchanged
        run: |
          {
            echo "## Nothing to release"
            echo
            echo "\`${{ steps.version.outputs.tag }}\` is already tagged and live."
            echo "Open a PR into main to bump the version, then merge."
          } >> "$GITHUB_STEP_SUMMARY"

      # Succeeds rather than fails: an undeployed site is a legitimate state
      # while the project is being set up, and a permanently red workflow gets
      # ignored.
      - if: steps.version.outputs.release == 'true' && steps.creds.outputs.ready != 'true'
        name: report that deploying is not configured
        run: |
          {
            echo "## Deploy skipped"
            echo
            echo "\`${{ steps.version.outputs.version }}\` passed lint and the type check, but this"
            echo "repository cannot deploy to Vercel. No tag was created."
            echo
            echo "Add a \`VERCEL_TOKEN\` secret and the \`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\`"
            echo "variables (Settings → Secrets and variables → Actions), then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Deploy skipped::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not configured. See the job summary."
